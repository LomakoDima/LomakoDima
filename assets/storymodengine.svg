<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="sme-title sme-desc"><title id="sme-title">StoryModEngine — editors to experience</title><desc id="sme-desc">Diagram: in-game editors (VFX, cutscene sequencer, .sme script IDE, replay, recipe, video assets) feed runtime systems (quests, dialogue, NPCs, triggers, shops, cinematics) through the Flow engine, which assemble into one story-driven Minecraft experience.</desc><rect width="1200" height="440" fill="#0A0A0B"/><text x="56" y="46" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#3FD0FF" letter-spacing="2.6">CURRENTLY BUILDING</text><text x="1144" y="46" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8B9099" text-anchor="end" letter-spacing="2.6">FORGE 1.20.1 · JAVA / KOTLIN · PRIVATE</text><path d="M56 66H1144" stroke="#25272C" stroke-width="1"/><text x="54" y="126" font-family="'Inter','Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif" font-size="44" fill="#F4F5F7" letter-spacing="-0.5" font-weight="600">StoryModEngine</text><text x="56" y="156" font-family="'Inter','Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif" font-size="17" fill="#8B9099">Author each system in its own editor, then assemble them into one experience.</text><text x="56" y="196" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#5A5E66" letter-spacing="2">A — AUTHOR</text><text x="470" y="196" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#5A5E66" letter-spacing="2">B — COMPOSE</text><text x="860" y="196" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#5A5E66" letter-spacing="2">C — PLAY</text><text x="56" y="228" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#5A5E66" letter-spacing="1">E.01</text><text x="104" y="228" font-family="'Inter','Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif" font-size="15" fill="#F4F5F7">VFX Editor</text><path d="M292 223C362 223 344 285 414 285" stroke="#25272C" stroke-width="1" fill="none"/><circle cx="292" cy="223" r="2" fill="#8B9099"/><text x="56" y="258" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#5A5E66" letter-spacing="1">E.02</text><text x="104" y="258" font-family="'Inter','Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif" font-size="15" fill="#F4F5F7">Cutscene Sequencer</text><path d="M292 253C362 253 344 285 414 285" stroke="#25272C" stroke-width="1" fill="none"/><circle cx="292" cy="253" r="2" fill="#8B9099"/><text x="56" y="288" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#5A5E66" letter-spacing="1">E.03</text><text x="104" y="288" font-family="'Inter','Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif" font-size="15" fill="#F4F5F7">Script IDE (.sme)</text><path d="M292 283C362 283 344 285 414 285" stroke="#25272C" stroke-width="1" fill="none"/><circle cx="292" cy="283" r="2" fill="#8B9099"/><text x="56" y="318" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#5A5E66" letter-spacing="1">E.04</text><text x="104" y="318" font-family="'Inter','Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif" font-size="15" fill="#F4F5F7">Replay Editor</text><path d="M292 313C362 313 344 285 414 285" stroke="#25272C" stroke-width="1" fill="none"/><circle cx="292" cy="313" r="2" fill="#8B9099"/><text x="56" y="348" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'L